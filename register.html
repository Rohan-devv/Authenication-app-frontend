<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #111827;
            --panel: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(255, 255, 255, 0.14);
            --accent: #7c3aed;
            --accent-strong: #a855f7;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #34d399;
            --shadow: 0 30px 80px rgba(15, 23, 42, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(124, 58, 237, 0.30), transparent 22%),
                        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.18), transparent 18%),
                        linear-gradient(180deg, #020617 0%, #0b1122 100%);
        }

        body {
            display: grid;
            place-items: center;
            padding: 2rem;
        }

        .page-shell {
            width: min(460px, 100%);
            padding: 2.2rem 2rem;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .brand {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(2rem, 4vw, 2.6rem);
            letter-spacing: -0.03em;
        }

        .brand p {
            margin: 0.7rem auto 0;
            color: var(--muted);
            max-width: 20rem;
            line-height: 1.7;
        }

        form {
            display: grid;
            gap: 1.05rem;
        }

        label {
            font-size: 0.95rem;
            color: var(--muted);
        }

        input,
        select {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.76);
            color: var(--text);
            font-size: 0.98rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.8);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: rgba(124, 58, 237, 0.95);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.14);
            transform: translateY(-1px);
        }

        button,
        .secondary-button {
            width: 100%;
            border-radius: 16px;
            padding: 1rem 1.1rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease, background 0.2s ease;
        }

        button {
            border: none;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            box-shadow: 0 18px 30px rgba(124, 58, 237, 0.24);
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .secondary-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 0 0 rgba(255,255,255,0.12);
        }

        .secondary-button:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #message {
            margin-top: 1rem;
            min-height: 1.2rem;
            text-align: center;
            color: var(--success);
            font-size: 0.98rem;
            letter-spacing: 0.01em;
        }

        .hint {
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
            margin-top: 1.2rem;
            line-height: 1.7;
        }

        @media (max-width: 420px) {
            .page-shell {
                padding: 1.6rem 1.4rem;
            }
        }
    </style>
</head>
<body>
    <section class="page-shell">
        <div class="brand">
            <h1>Create Your Account</h1>
            <p>Register quickly and securely to join the dashboard with a premium glass-style experience.</p>
        </div>

        <form id="registerForm">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter your email" name="email" required />

            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Choose a username" name="username" required />

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Create a password" name="password" required />

            <label for="role">Select role</label>
            <select id="role" name="role">
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>

            <button id="register" type="submit">Register</button>
            <a class="secondary-button" href="index.html">Already registered? Login</a>
        </form>

        <p id="message"></p>
        <p class="hint">Already got an account? Use the login option above to sign in instantly.</p>
    </section>

    <script src="app.js"></script>
</body>
</html>
